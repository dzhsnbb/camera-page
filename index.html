<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>拍照上传</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
        }

        video,
        img {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📷 拍照</h2>

    <video id="video" autoplay playsinline></video>

    <br>

    <button id="start">
        打开摄像头
    </button>

    <button id="take">
        拍照
    </button>

    <button id="upload">
        上传照片
    </button>

    <canvas id="canvas" style="display:none;"></canvas>

    <img id="preview" style="display:none;">

    <p id="status"></p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /* =========================
       Supabase 配置
       ========================= */

    const SUPABASE_URL =
        "https://rrrbnpfddduqunudujbn.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_UIyqChvTKMOOglaCgAemeQ_BM1xGBx-";


    const client =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       页面元素
       ========================= */

    const video =
        document.getElementById("video");

    const canvas =
        document.getElementById("canvas");

    const preview =
        document.getElementById("preview");

    const status =
        document.getElementById("status");


    let stream = null;

    let photoBlob = null;


    /* =========================
       打开摄像头
       ========================= */

    document
        .getElementById("start")
        .onclick = async () => {

        try {

            stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        video: {
                            facingMode: "user"
                        }
                    });

            video.srcObject = stream;

            status.textContent =
                "摄像头已打开，请点击「拍照」";

        } catch (error) {

            status.textContent =
                "无法打开摄像头：" +
                error.message;

        }

    };


    /* =========================
       拍照
       ========================= */

    document
        .getElementById("take")
        .onclick = () => {

        if (!stream) {

            status.textContent =
                "请先点击「打开摄像头」";

            return;
        }


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext("2d");


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        canvas.toBlob(
            (blob) => {

                photoBlob = blob;

                preview.src =
                    URL.createObjectURL(blob);

                preview.style.display =
                    "block";

                status.textContent =
                    "拍照成功，请点击「上传照片」";

            },
            "image/jpeg",
            0.9
        );

    };


    /* =========================
       上传照片
       ========================= */

    document
        .getElementById("upload")
        .onclick = async () => {

        if (!photoBlob) {

            status.textContent =
                "请先拍照";

            return;
        }


        status.textContent =
            "正在上传，请稍候...";


        const fileName =
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2) +
            ".jpg";


        const result =
            await client.storage
                .from("photos")
                .upload(
                    fileName,
                    photoBlob,
                    {
                        contentType:
                            "image/jpeg"
                    }
                );


        if (result.error) {

            status.textContent =
                "上传失败：" +
                result.error.message;

            return;
        }


        status.textContent =
            "✅ 上传成功！";

    };

</script>

</body>
</html>
